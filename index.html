<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Drill 2</title>
    <style>
        body{
            background-color: aliceblue;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        header{
            text-align: center;
        }
        section{
            background-color: #e796e8;
    	padding: 20px;
    	border-radius: 12px;
    	width: 600px;
    	margin: auto;
    	box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
img{
            display: block;
            margin: auto;
            height: 100px;
            width: 100px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Review a Film!</h1>
             <br>
        <p>Rate a film and write a review here...</p>
    </header>

    <br>

    <section>
        <form action="">
            <img src="https://png.pngtree.com/png-clipart/20190515/original/pngtree-clapperboard-film-logo-icon-design-template-vector-isolated-png-image_3698967.jpg" alt="Movie Logo">
            <br>

            <label for="Movie">Movie Title:</label>
            <input type="" id="Movie" name="Movie" placeholder="Enter here">

            <br>
            <label for="genre">Genre/s:</label>
            <br>
            <input type="checkbox" id="genre1" name="Genre" value="Sci-fi">
            <label for="genre1">Sci-fi</label>

            <input type="checkbox" id="genre2" name="Genre" value="Drama">
            <label for="genre2">Drama</label>

            <input type="checkbox" id="genre3" name="Genre" value="Romance">
            <label for="genre3">Romance</label>

            <input type="checkbox" id="genre4" name="Genre" value="Thriller">
            <label for="genre4">Thriller</label>

            <input type="checkbox" id="genre5" name="Genre" value="Adventure">
            <label for="genre5">Adventure</label>

            <br>
            <label for="rating">Rating:</label>
            <br>
            <input type="radio" id="rate1" name="rate" value="star1">
            <label for="rate1">👍</label>

            <input type="radio" id="rate2" name="rate" value="star2">
            <label for="rate2">👍👍</label>

            <input type="radio" id="rate3" name="rate" value="star3">
            <label for="rate3">👍👍👍</label>

            <input type="radio" id="rate4" name="rate" value="star4">
            <label for="rate4">👍👍👍👍</label>

            <input type="radio" id="rate5" name="rate" value="star5">
            <label for="rate5">👍👍👍👍👍</label>

            <br>
            <textarea id="review" name="review" placeholder="Write a review.." rows="5" cols="40"></textarea>
            <br>

            <input type="submit" id="submit" name="submit" value="Submit Review">
            <br>

            For movie review tips, click<a href="https://www.fantasy-animation.org/current-posts/how-to-write-a-movie-review-a-step-by-step-guide" target=""> here</a>

        </form>
    </section>

      <!--Reference
	Nyfa, & Nyfa. (2024, March 23). How to write a movie review: 10     essential tips. NYFA. https://www.nyfa.edu/student-resources/9-tips-for-writing-a-film-review/
    -->
</body>
</html>
